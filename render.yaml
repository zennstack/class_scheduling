services:
  - type: web
    name: class-scheduling-backend
    runtime: python
    buildCommand: "./build.sh"
    startCommand: "gunicorn ClassScheduling.wsgi:application"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: "*"
      - key: DATABASE_URL
        fromDatabase:
          name: class-scheduling-db
          property: connectionString
      - key: FRONTEND_URL
        sync: false
      - key: BREVO_SMTP_USER
        sync: false
      - key: BREVO_SMTP_PASSWORD
        sync: false
      - key: DEFAULT_FROM_EMAIL
        sync: false

databases:
  - name: class-scheduling-db
    plan: free
